; Live voice for app_speakingclock (docs/voice-format.md), made by
; tools/synth_voices.py --live macintalk:boing.  Each sentence is spoken when
; it is needed, by synth/macintalk, run here (tts_program_macintalk).
; The synthesiser is ours; the voice data it reads is Apple's and is
; not in this repository (tools/fetch-macintalk.py downloads it); see NOTICE.md.

[voice]
name=MacInTalk Boing, live
description=MacInTalk 3 voice (spoken by a spring), spoken live
mode=tts
sequence=speech+pips
period=10

[tts]
command={program:macintalk} -v boing -o {out} "{text}"
text=At the third stroke, it will be {hour} {minute} {seconds}.

[source]
engine=macintalk
voice=boing
synthesiser=synth/macintalk (this repository, clean-room) reading Apple's MacInTalk 3 voice data (Mac OS 8.1), fetched by tools/fetch-macintalk.py
