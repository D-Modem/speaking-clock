; Live voice for app_speakingclock (docs/voice-format.md), made by
; tools/synth_voices.py --live dectalk:ursula.  Each sentence is spoken when
; it is needed, by DECtalk's say, run here (tts_program_dectalk).
; The synthesiser belongs to its owners; see NOTICE.md.

[voice]
name=DECtalk Uppity Ursula, live
description=DECtalk 4.x, spoken live
mode=tts
sequence=speech+pips
period=10

[tts]
command={program:dectalk} -fo {out} -a "[:nu] {text}"
text=At the third stroke, it will be {hour} {minute} {seconds}.

[source]
engine=dectalk
voice=ursula
synthesiser=DECtalk (Digital Equipment Corp.), https://github.com/dectalk/dectalk
