; Live voice for app_speakingclock (docs/voice-format.md), made by
; tools/synth_voices.py --live plaintalk:victoria.  Each sentence is spoken when
; it is needed, by synth/macintalk, run here (tts_program_macintalk).
; The synthesiser is ours; the voice data it reads is Apple's and is
; not in this repository (tools/fetch-macintalk.py downloads it); see NOTICE.md.

[voice]
name=PlainTalk Victoria, live
description=PlainTalk (MacinTalk Pro) voice, female, spoken live
mode=tts
sequence=speech+pips
period=10

[tts]
command={program:macintalk} -v victoria -o {out} "{text}"
text=At the third stroke, it will be {hour} {minute} {seconds}.

[source]
engine=plaintalk
voice=victoria
synthesiser=synth/macintalk (this repository, clean-room) joining Apple's recorded PlainTalk diphones (Mac OS 8.6), fetched by tools/fetch-macintalk.py
