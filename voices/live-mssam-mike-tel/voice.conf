; Live voice for app_speakingclock (docs/voice-format.md), made by
; tools/synth_voices.py --live mssam:mike-tel.  Each sentence is spoken when
; it is needed, by synth/mssam, run here (tts_program_mssam).
; The synthesiser is ours; the voice data it reads is Microsoft's and is
; not in this repository (tools/fetch-mssam.py downloads it); see NOTICE.md.

[voice]
name=Microsoft Mike for Telephone, live
description=Microsoft Speech API 4 voice Mike, made for phone lines, by our own synthesiser, spoken live
mode=tts
sequence=speech+pips
period=10

[tts]
command={program:mssam} -v mike-tel -o {out} "{text}"
text=At the third stroke, it will be {hour} {minute} {seconds}.

[source]
engine=mssam
voice=mike-tel
synthesiser=synth/mssam (this repository, clean-room) reading Microsoft's Speech API 4 voice data (msttsl.exe), fetched by tools/fetch-mssam.py
