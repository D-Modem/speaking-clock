; Live voice for app_speakingclock (docs/voice-format.md), made by
; tools/synth_voices.py --live sam:elf.  Each sentence is spoken when
; it is needed, by SAM, run here (tts_program_sam).
; The synthesiser belongs to its owners; see NOTICE.md.

[voice]
name=SAM Elf, live
description=Software Automatic Mouth (Commodore 64, 1982), spoken live
mode=tts
sequence=speech+pips
period=10

[tts]
command={program:sam} -wav {out} -speed 72 -pitch 64 -mouth 110 -throat 160 "{text}"
text=At the third stroke, it will be {hour} {minute} {seconds}.

[source]
engine=sam
voice=elf
synthesiser=SAM, Don't Ask Software (now SoftVoice, Inc.), C port https://github.com/s-macke/SAM
